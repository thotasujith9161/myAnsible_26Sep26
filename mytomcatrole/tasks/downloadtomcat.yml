---
- name: download tomcat
  ansible.builtin.get_url:
    url: "{{mytomcaturl}}"
    dest: /home/maha/apache-tomcat-10.1.14.tar.gz
    mode: '0644'
    force_basic_auth: yes

- name: create tomcat dorectory
  ansible.builtin.file:    
       path: /opt/tomcat
       state: directory

- name: extract tomcat
  ansible.builtin.unarchive:
       src: /home/ubuntu/apache-tomcat-10.1.14.tar.gz
       dest: /opt/tomcat
       remote_src: yes
       extra_opts:
       - --strip-components=1